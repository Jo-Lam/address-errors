[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "address-errors"
version = "0.1.1"
description = "Tunable, realistic UK address recording errors for your own addresses (no UPRN or OS data needed), with a labelled truth table for benchmarking"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Joseph Lam", email = "joseph.lam@ucl.ac.uk"}]
keywords = ["address matching", "record linkage", "synthetic data", "benchmark", "data quality", "UPRN"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []          # the corruptor itself is standard library only

[project.urls]
Homepage = "https://github.com/Jo-Lam/address-errors"
Documentation = "https://github.com/Jo-Lam/address-errors/blob/main/README.md"
"Fitting a profile" = "https://github.com/Jo-Lam/address-errors/blob/main/docs/pipeline.md"
Validation = "https://github.com/Jo-Lam/address-errors/blob/main/docs/validation.md"

[project.optional-dependencies]
pipeline = ["pandas>=1.5", "numpy", "duckdb>=0.9", "rapidfuzz>=3", "PyYAML", "scipy", "scikit-learn"]
evaluate = ["pandas>=1.5", "numpy", "duckdb>=0.9", "rapidfuzz>=3", "PyYAML", "lightgbm", "scikit-learn"]
test = ["pytest"]

[project.scripts]
address-errors = "address_errors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
address_errors = ["data/*/*.json", "data/example/*.csv", "pipeline/study_general/*.json", "pipeline/study_general/*.md"]
